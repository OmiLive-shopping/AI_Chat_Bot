app = "omi-chatbot-backend"  # ← Replace with your actual app name from fly.io

[env]
PORT = "10000"

[build]
builder = "paketobuildpacks/builder:base"

[http_service]
internal_port = 10000
force_https = true
auto_start_machines = true
auto_stop_machines = true
min_machines_running = 1

[processes]
app = "gunicorn app:app --workers=1 --timeout=120 --bind 0.0.0.0:10000"

[resources]
memory = 1024  # You can bump this later if needed
