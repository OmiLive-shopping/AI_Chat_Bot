steps:
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/main-entropy-467501-b6/omi-backend/backend',
      '.'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/main-entropy-467501-b6/omi-backend/backend'
    ]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'omi-backend',
      '--image', 'us-central1-docker.pkg.dev/main-entropy-467501-b6/omi-backend/backend',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--memory', '2Gi',
      '--cpu', '2',
      '--timeout', '300s'
    ]

images:
  - 'us-central1-docker.pkg.dev/main-entropy-467501-b6/omi-backend/backend'

options:
  logging: CLOUD_LOGGING_ONLY
