steps:
  # Step 1: Build Docker image from backend folder
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/main-entropy-467501-b6/omi-backend/backend',
      '.'
    ]

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/main-entropy-467501-b6/omi-backend/backend'
    ]

  # Step 3: Deploy to Cloud Run with increased memory
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'omi-backend',
      '--image', 'us-central1-docker.pkg.dev/main-entropy-467501-b6/omi-backend/backend',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--memory', '1Gi'
    ]

images:
  - 'us-central1-docker.pkg.dev/main-entropy-467501-b6/omi-backend/backend'

options:
  logging: CLOUD_LOGGING_ONLY
